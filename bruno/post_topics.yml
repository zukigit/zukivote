info:
  name: post_topics
  type: http
  seq: 1

http:
  method: POST
  url: 127.0.0.1:8080/topics
  headers:
    - name: Authorization
      value: Bearer {{LOGIN_TOKEN}}
  body:
    type: json
    data: |-
      {
        "start_at": "2024-01-01T00:00:00+06:30",
        "expired_at": "2024-01-02T00:00:00+06:30",
        "voter_count": 3,
        "name": "my topic"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
