info:
  name: get_voters
  type: http
  seq: 11

http:
  method: GET
  url: 127.0.0.1:8080/voters?topic_id={{TOPIC_ID}}
  headers:
    - name: Authorization
      value: Bearer {{LOGIN_TOKEN}}
  params:
    - name: topic_id
      value: "{{TOPIC_ID}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
