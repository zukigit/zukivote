info:
  name: post_voting
  type: http
  seq: 10

http:
  method: POST
  url: 127.0.0.1:8080/voting
  headers:
    - name: Authorization
      value: Bearer {{LOGIN_TOKEN}}
  body:
    type: json
    data: |-
      {
        "voter_id": "{{VOTER_ID}}",
        "item_id": {{ITEM_ID}}
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
